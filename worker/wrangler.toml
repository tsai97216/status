name = "chi-status-trigger"
main = "index.js"
compatibility_date = "2026-10-16"
workers_dev = true

[vars]
# Set to the generated Chi Auth client ID after registering the Status callback.
# Keep blank until Chi Auth is deployed and end-to-end testing is complete.
CHI_AUTH_STATUS_CLIENT_ID = ""

# Per-IP protection against repeated requests and credential guessing.
[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "826104161"
simple = { limit = 20, period = 60 }

# Limit authenticated workflow dispatches to reduce accidental or abusive runs.
[[ratelimits]]
name = "DISPATCH_RATE_LIMITER"
namespace_id = "826104162"
simple = { limit = 5, period = 60 }
