<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Chi Status 工作流程控制台，集中管理已核准的 GitHub Actions 工作流程。">
<title>Chi Status · Actions 控制台</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--surface:#111a2e;--surface2:#17233b;--surface3:#1d2c48;--line:#293954;--text:#edf4ff;--muted:#9aacc6;--blue:#78aaff;--green:#61d9ac;--red:#ff7f8b;--amber:#f6c76b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#3568c226,transparent 34%),var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.005em}main{max-width:1220px;margin:auto;padding:28px 28px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px;min-width:0}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#6fa8ff,#7c72ff);color:#fff;box-shadow:0 8px 25px #3d6dc633}.brand-mark svg{width:22px;height:22px}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--blue);text-transform:uppercase}h1{font-size:22px;letter-spacing:-.035em;font-weight:750;line-height:1.2;margin:2px 0 4px}.sub{color:var(--muted);font-size:12px;max-width:610px;margin:0}
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.header-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.page-nav{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.page-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:7px 13px;border-radius:8px;color:var(--muted);font-size:12px;font-weight:650;text-decoration:none;white-space:nowrap}.page-nav a:hover{color:var(--text);background:var(--surface2)}.page-nav a[aria-current=page]{background:var(--surface3);color:var(--text);box-shadow:inset 0 0 0 1px #45618b}
.actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;transition:.15s}button:hover,.btn:hover{border-color:#5d8bd0;background:var(--surface2)}button:disabled{opacity:.6;cursor:wait}.button-icon{width:15px;height:15px;display:inline-block;vertical-align:middle;stroke-width:1.8}#themeToggle{display:inline-flex;align-items:center;justify-content:center;line-height:1;box-sizing:border-box}#themeToggle #themeIcon{display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:initial}#themeToggle .button-icon{display:block;flex:none;vertical-align:initial}
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:24px;margin:24px 0 17px;padding:25px 27px;border:1px solid #344b70;border-radius:18px;background:linear-gradient(110deg,#172b4a,#17243d 55%,#252b58);box-shadow:0 18px 45px #0002}.hero:after{content:"";position:absolute;width:270px;height:270px;right:4%;top:-180px;border:1px solid #91b9ff2e;border-radius:50%;box-shadow:0 0 0 28px #91b9ff0b,0 0 0 58px #91b9ff08;pointer-events:none}.hero-copy{position:relative;z-index:1;max-width:670px}.hero-kicker{display:flex;align-items:center;gap:8px;color:#a9c8ff;font-size:10px;font-weight:800;letter-spacing:.15em}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #61d9ac1c}.hero h2{font-size:clamp(22px,3vw,28px);line-height:1.2;letter-spacing:-.04em;margin:10px 0 8px}.hero p{color:#b5c5de;font-size:13px;margin:0;max-width:590px}.hero-side{position:relative;z-index:1;min-width:150px;text-align:right}.hero-side .mini-label{font-size:10px;color:#a9bad5;letter-spacing:.1em}.hero-side strong{display:block;font-size:16px;margin-top:5px;color:#eaf2ff}.hero-side span{font-size:11px;color:#a9bad5}
.toolbar{display:grid;grid-template-columns:minmax(200px,1fr) minmax(175px,220px) auto;gap:9px;align-items:center;margin:0 0 15px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:13px}.toolbar input,.toolbar select{width:100%;min-width:0;min-height:41px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;font-size:12px}.hint{font-size:11px;color:var(--muted);white-space:nowrap}#message{margin:12px 0;padding:11px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#message:empty{display:none}#message[data-kind=ok]{color:var(--green);border-color:#285a4d}#message[data-kind=error]{color:var(--red);border-color:#633b4a}#message[data-kind=warn]{color:var(--amber)}
#workflows{display:block}.workflow-group{margin:23px 0 0}.group-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 2px 10px;border-bottom:1px solid var(--line);margin-bottom:12px}.group-title{font-size:15px;font-weight:750;margin:0;letter-spacing:-.01em}.group-count{font-size:10px;color:var(--muted);padding:4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:20px}.group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0;transition:border-color .15s}.card:hover{border-color:#40577b}.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.name{font-weight:720;font-size:14px;line-height:1.4}.repo{font-size:10px;color:var(--muted);overflow-wrap:anywhere;margin-top:5px}.group{font-size:10px;padding:4px 8px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;white-space:nowrap;color:var(--muted)}.warning{font-size:11px;color:var(--amber);background:#352a1c;border:1px solid #775b32;border-radius:8px;padding:9px 11px;margin:12px 0}
.fields{display:grid;gap:11px;margin-top:15px}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted)}.field input[type=text],.field input[type=url],.field select{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font:inherit;font-size:12px}.check{display:flex;align-items:center;gap:9px;color:var(--text);font-size:12px}.check input{width:17px;height:17px;accent-color:var(--blue)}.foot{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:13px;margin-top:15px}.foot .btn,.foot button{font-size:10px;min-height:33px;padding:6px 10px}.foot .actions{gap:6px}.empty{padding:38px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);background:#111a2e66}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}html[data-theme=light]{color-scheme:light;--bg:#f3f6fc;--surface:#fff;--surface2:#f0f4fb;--surface3:#e5edfb;--line:#dce4f0;--text:#18243a;--muted:#687991;--blue:#316fd4;--green:#168c68;--red:#c8465b;--amber:#a76c14;background:radial-gradient(ellipse at 12% 0%,#3568c214,transparent 34%),var(--bg)}html[data-theme=light] .hero{background:linear-gradient(110deg,#e3edff,#eaf0ff 60%,#eeeaff);border-color:#d4e0f5}html[data-theme=light] .hero h2{color:#172a49}html[data-theme=light] .hero p,html[data-theme=light] .hero-side span,html[data-theme=light] .hero-side .mini-label{color:#5f7191}html[data-theme=light] .hero-side strong{color:#233b63}html[data-theme=light] .hero-kicker{color:#3567b1}html[data-theme=light] .card{background:#fff}html[data-theme=light] .warning{background:#fff6e5;border-color:#e8d09d;color:#80591a}html[data-theme=light] .empty{background:#ffffff99}
@media(max-width:850px){main{padding:22px 18px 42px}.top{align-items:flex-start}.top-actions{width:100%;justify-content:space-between}.group-grid{grid-template-columns:1fr}}@media(max-width:560px){main{padding:16px 12px 34px}.top{position:relative;gap:15px;padding-bottom:16px}.brand-mark{width:40px;height:40px;border-radius:12px}.brand{gap:10px;padding-right:48px}h1{font-size:20px}.top-actions{display:flex;flex-direction:column;align-items:stretch;gap:9px}.page-nav{width:100%}.page-nav a{flex:1}.header-tools{display:grid;grid-template-columns:1fr 1fr}.header-tools>*{width:100%}#themeToggle{position:absolute;top:0;right:0;width:40px;height:40px;min-height:40px;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;box-sizing:border-box;z-index:3}#themeToggle .button-icon{display:block;flex:none;vertical-align:initial}#themeLabel{display:none}.hero{display:block;margin:17px 0 14px;padding:20px 18px;border-radius:14px}.hero h2{font-size:23px}.hero-side{margin-top:18px;padding-top:13px;border-top:1px solid #ffffff1e;text-align:left}.hero-side strong{display:inline-block;margin-right:8px}.toolbar{grid-template-columns:1fr;padding:9px;gap:8px}.hint{white-space:normal}.head{gap:8px}.group{white-space:normal;text-align:right}.foot{align-items:flex-start}.foot>.actions{width:100%}.foot>.actions>*{flex:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <header class="top"><div class="brand"><div class="brand-mark"><i data-lucide="workflow" aria-hidden="true"></i></div><div><div class="eyebrow">CHI · STATUS CENTER</div><h1>Actions 控制台</h1><p class="sub">集中管理狀態總覽追蹤的自動化工作流程。</p></div></div><div class="top-actions"><nav class="page-nav" aria-label="Chi Status 導覽"><a href="./">狀態總覽</a><a href="./actions.html" aria-current="page">Actions 控制台</a></nav><div class="header-tools"><button id="themeToggle" type="button" aria-label="切換色彩模式"><span id="themeIcon" class="button-icon" aria-hidden="true"></span><span id="themeLabel">跟隨系統</span></button><button id="passkeyLogin" type="button" disabled title="待 Chi Auth 部署並註冊 Status 應用後啟用"><i class="button-icon" data-lucide="fingerprint" aria-hidden="true"></i>Passkey 登入</button><button id="legacyLogin" type="button" hidden><i class="button-icon" data-lucide="key-round" aria-hidden="true"></i>使用舊授權金鑰</button><button id="passkeyLogout" type="button" hidden><i class="button-icon" data-lucide="log-out" aria-hidden="true"></i>登出 Passkey</button><button id="reload" type="button"><i class="button-icon" data-lucide="refresh-cw" aria-hidden="true"></i>重新載入清單</button><button id="forget" type="button"><i class="button-icon" data-lucide="key-round" aria-hidden="true"></i>清除授權金鑰</button></div></div></header>
  <section class="hero"><div class="hero-copy"><h2>工作流程</h2><p>執行已核准的 GitHub Actions 工作流程，並查看執行結果。</p></div></section>
  <section class="toolbar"><input id="search" type="search" placeholder="搜尋專案或工作流程…" aria-label="搜尋"><select id="group" aria-label="依類型篩選"><option value="">全部類型</option></select><span id="count" class="hint">讀取中…</span></section>
  <div id="message" role="status" aria-live="polite"></div>
  <section id="workflows" class="grid"><div class="empty">正在讀取工作流程清單…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
const API_URL = "https://chi-status-trigger.tsai97216.workers.dev";
const KEY_STORAGE = "chi-status-trigger-key";
const AUTH_API_URL = "https://chi.qzz.io/auth/api";
const AUTH_CLIENT_ID = ""; // Fill after Chi Auth is deployed and Status is registered as a client.
const AUTH_REDIRECT_URI = "https://status.chi.qzz.io/actions.html?auth_callback=1";
const AUTH_STATE_STORAGE = "chi-status-sso-state";
const AUTH_VERIFIER_STORAGE = "chi-status-sso-verifier";
let authAccessToken = ""; // Keep the short-lived token in memory only.
let useLegacyKey = false;
const $ = id => document.getElementById(id);
let workflows = [];
let busy = false;

function message(text, kind="") {
  const el = $("message");
  el.textContent = text;
  el.dataset.kind = kind;
}
function getKey() {
  let key = "";
  try { key = localStorage.getItem(KEY_STORAGE) || ""; } catch {}
  if (!key) {
    key = prompt("請輸入 Status Worker 的 TRIGGER_SECRET：") || "";
    key = key.trim();
    if (key) {
      try { localStorage.setItem(KEY_STORAGE, key); } catch {}
    }
  }
  return key;
}
async function api(path, options={}) {
  if (!API_URL) throw new Error("API 網址尚未設定。請先部署 Worker，並把網址填入 actions.html 的 API_URL。");
  const headers = { ...(options.headers || {}) };
  if (authAccessToken) {
    headers.Authorization = "Bearer " + authAccessToken;
  } else {
    if (AUTH_CLIENT_ID && !useLegacyKey) throw new Error("請先使用 Passkey 登入，或點擊「使用舊授權金鑰」作為備援。");
    const key = getKey();
    if (!key) throw new Error("未輸入授權金鑰。");
    headers["X-Trigger-Key"] = key;
  }
  const response = await fetch(API_URL + path, { ...options, headers });
  let data = {};
  try { data = await response.json(); } catch {}
  if (response.status === 401 && authAccessToken) {
    authAccessToken = "";
    $("passkeyLogin").hidden = false;
    $("passkeyLogout").hidden = true;
    throw new Error("Passkey 授權已過期，請重新登入。");
  }
  if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}
function create(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}
function workflowUrl(item) {
  return `https://github.com/${item.repository}/actions/workflows/${encodeURIComponent(item.workflow)}`;
}
function render() {
  const query = $("search").value.trim().toLowerCase();
  const group = $("group").value;
  const visible = workflows.filter(item => {
    const haystack = [item.name, item.repository, item.workflow, item.group].join(" ").toLowerCase();
    return (!query || haystack.includes(query)) && (!group || item.group === group);
  });
  const groupOrder = {"Status 維護":0,"來源更新":1,"內容更新":2,"自動化":3,"驗證":4,"部署":5,"暫不可觸發":6,"外部監控":7};
  visible.sort((a,b) => (groupOrder[a.group] ?? 99) - (groupOrder[b.group] ?? 99) || Number(a.available === false) - Number(b.available === false) || a.name.localeCompare(b.name, "zh-Hant"));
  $("count").textContent = `${visible.length} / ${workflows.length} 項`;
  const root = $("workflows");
  root.replaceChildren();
  if (!visible.length) {
    root.append(create("div", "empty", "沒有符合條件的工作流程。"));
    return;
  }
  let activeGroup = null;
  let activeGrid = null;
  for (const item of visible) {
    const groupName = item.group || "其他";
    if (groupName !== activeGroup) {
      activeGroup = groupName;
      const section = create("section", "workflow-group");
      const heading = create("div", "group-heading");
      const groupTotal = visible.filter(entry => (entry.group || "其他") === groupName).length;
      heading.append(create("h2", "group-title", groupName), create("span", "group-count", `${groupTotal} 項`));
      activeGrid = create("div", "group-grid");
      section.append(heading, activeGrid);
      root.append(section);
    }
    const card = create("article", "card");
    const head = create("div", "head");
    const info = create("div");
    info.append(create("div", "name", item.name), create("div", "repo", `${item.repository} · ${item.workflow}`));
    head.append(info, create("span", "group", item.group || "其他"));
    card.append(head);
    if (item.available === false) {
      card.append(create("div", "warning", item.reason || "目前無法從控制台觸發。"));
      const foot = create("div", "foot");
      foot.append(create("span", "hint", "僅供狀態參考"));
      if (item.repository.startsWith("tsai97216/")) {
        const link = create("a", "btn", "查看專案");
        link.href = `https://github.com/${item.repository}/actions`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        foot.append(link);
      } else {
        const link = create("a", "btn", "查看狀態總覽");
        link.href = "./";
        foot.append(link);
      }
      card.append(foot);
      activeGrid.append(card);
      continue;
    }
    if (item.danger) card.append(create("div", "warning", item.danger));
    const form = create("form", "fields");
    for (const spec of item.inputs || []) {
      const wrap = create("div", "field");
      const id = "f-" + item.repository.replace(/[^a-z0-9]/gi,"-") + "-" + item.workflow.replace(/[^a-z0-9]/gi,"-") + "-" + spec.name;
      if (spec.type === "boolean") {
        const label = create("label", "check");
        const input = create("input");
        input.type = "checkbox";
        input.name = spec.name;
        input.checked = spec.default === true;
        label.append(input, document.createTextNode(spec.label + (spec.required ? "（必填）" : "")));
        wrap.append(label);
      } else {
        const label = create("label", "", spec.label + (spec.required ? "（必填）" : ""));
        label.htmlFor = id;
        let input;
        if (spec.type === "choice") {
          input = create("select");
          for (const option of spec.options || []) {
            const opt = create("option", "", option);
            opt.value = option;
            input.append(opt);
          }
          input.value = spec.default || (spec.options || [])[0] || "";
        } else {
          input = create("input");
          input.type = "text";
          input.value = spec.default || "";
          input.placeholder = spec.required ? "請填寫必要參數" : "可留空";
        }
        input.id = id;
        input.name = spec.name;
        input.required = !!spec.required;
        wrap.append(label, input);
      }
      form.append(wrap);
    }
    const foot = create("div", "foot");
    foot.append(create("span", "hint", "分支：main"));
    const buttons = create("div", "actions");
    const history = create("a", "btn", "執行紀錄");
    history.href = workflowUrl(item);
    history.target = "_blank";
    history.rel = "noopener noreferrer";
    const run = create("button", "", "立即觸發");
    run.type = "submit";
    buttons.append(history, run);
    foot.append(buttons);
    form.append(foot);
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy) return;
      const inputs = {};
      for (const spec of item.inputs || []) {
        const field = form.elements.namedItem(spec.name);
        if (spec.type === "boolean") inputs[spec.name] = field.checked;
        else if (field.value !== "") inputs[spec.name] = field.value;
      }
      const confirmText = item.danger ? `確認執行「${item.name}」？\n\n${item.danger}\n\n此操作會使用 main 分支。` : `確認觸發「${item.name}」？`;
      if (!confirm(confirmText)) return;
      busy = true;
      run.disabled = true;
      run.textContent = "提交中…";
      message(`正在提交：${item.repository} / ${item.workflow}`);
      try {
        const result = await api("", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ repository: item.repository, workflow: item.workflow, ref: "main", inputs })
        });
        message(`GitHub 已接受觸發請求：${result.repository} / ${result.workflow}\n這不代表工作流程已成功完成，請開啟「執行紀錄」查看結果。`, "ok");
      } catch (error) {
        message(`觸發失敗：${error.message}`, "error");
      } finally {
        busy = false;
        run.disabled = false;
        run.textContent = "立即觸發";
      }
    });
    card.append(form);
    activeGrid.append(card);
  }
}
async function load() {
  $("reload").disabled = true;
  message("正在讀取狀態總覽專案清單…");
  try {
    const data = await api("?action=catalog");
    workflows = data.workflows || [];
    const groups = [...new Set(workflows.map(item => item.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
    const select = $("group");
    select.replaceChildren(create("option", "", "全部類型"));
    select.firstChild.value = "";
    for (const name of groups) {
      const option = create("option", "", name);
      option.value = name;
      select.append(option);
    }
    message("");
    render();
  } catch (error) {
    $("workflows").replaceChildren(create("div", "empty", "無法載入工作流程清單。"));
    message(error.message, "error");
    $("count").textContent = "載入失敗";
  } finally {
    $("reload").disabled = false;
  }
}

function themeIconNode(name) {
  const el = document.createElement("i");
  el.className = "button-icon";
  el.setAttribute("aria-hidden", "true");
  el.setAttribute("data-lucide", name);
  return el;
}
function renderThemeIcon() {
  if (window.lucide && typeof window.lucide.createIcons === "function") window.lucide.createIcons();
}
const themeToggle = $("themeToggle"), themeIcon = $("themeIcon"), themeLabel = $("themeLabel");
const themeModes = ["system", "light", "dark"];
const themeNames = { system: "跟隨系統", light: "淺色模式", dark: "深色模式" };
const systemTheme = window.matchMedia("(prefers-color-scheme: light)");
function setTheme(mode, save=false) {
  const resolved = mode === "system" ? (systemTheme.matches ? "light" : "dark") : mode;
  document.documentElement.dataset.theme = resolved;
  themeIcon.replaceChildren(themeIconNode(mode === "system" ? "monitor" : mode === "light" ? "sun" : "moon"));
  renderThemeIcon();
  themeLabel.textContent = themeNames[mode];
  themeToggle.setAttribute("aria-label", "色彩模式：" + themeNames[mode] + "，點擊切換");
  themeToggle.title = "色彩模式：" + themeNames[mode];
  document.querySelector('meta[name="theme-color"]').content = resolved === "light" ? "#f5f6f8" : "#0f1115";
  if (save) { try { localStorage.setItem("chi-status-theme", mode); } catch {} }
}
let currentTheme = "system";
try { currentTheme = localStorage.getItem("chi-status-theme") || "system"; } catch {}
if (!themeModes.includes(currentTheme)) currentTheme = "system";
setTheme(currentTheme);
themeToggle.addEventListener("click", () => {
  currentTheme = themeModes[(themeModes.indexOf(currentTheme) + 1) % themeModes.length];
  setTheme(currentTheme, true);
});
systemTheme.addEventListener("change", () => { if (currentTheme === "system") setTheme("system"); });

function randomBase64Url(size=32) {
  const bytes = crypto.getRandomValues(new Uint8Array(size));
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replaceAll("+","-").replaceAll("/","_").replace(/=+$/g,"");
}
async function pkceChallenge(verifier) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  let binary = "";
  for (const byte of new Uint8Array(digest)) binary += String.fromCharCode(byte);
  return btoa(binary).replaceAll("+","-").replaceAll("/","_").replace(/=+$/g,"");
}
async function startPasskeyLogin() {
  if (!AUTH_CLIENT_ID) {
    message("Chi Auth 尚未部署完成或尚未註冊 Status 應用。Passkey 登入暫未啟用，現有授權方式仍可使用。", "warn");
    return;
  }
  try {
    const verifier = randomBase64Url(32);
    const state = randomBase64Url(32);
    sessionStorage.setItem(AUTH_STATE_STORAGE, state);
    sessionStorage.setItem(AUTH_VERIFIER_STORAGE, verifier);
    const challenge = await pkceChallenge(verifier);
    const authorize = new URL(AUTH_API_URL + "/authorize");
    authorize.searchParams.set("client_id", AUTH_CLIENT_ID);
    authorize.searchParams.set("redirect_uri", AUTH_REDIRECT_URI);
    authorize.searchParams.set("response_type", "code");
    authorize.searchParams.set("code_challenge", challenge);
    authorize.searchParams.set("code_challenge_method", "S256");
    authorize.searchParams.set("state", state);
    location.assign(authorize.toString());
  } catch (error) {
    message("無法開始 Passkey 登入：" + error.message, "error");
  }
}
async function initializePasskeySSO() {
  $("passkeyLogin").disabled = !AUTH_CLIENT_ID;
  $("passkeyLogin").title = AUTH_CLIENT_ID ? "使用 Chi Passkey 登入" : "待 Chi Auth 部署並註冊 Status 應用後啟用";
  $("legacyLogin").hidden = !AUTH_CLIENT_ID;
  const url = new URL(location.href);
  if (url.searchParams.get("auth_callback") !== "1") return;
  try {
    if (!AUTH_CLIENT_ID) throw new Error("Chi Auth 尚未完成部署與 Status 客戶端設定。");
    const code = url.searchParams.get("code") || "";
    const state = url.searchParams.get("state") || "";
    const expectedState = sessionStorage.getItem(AUTH_STATE_STORAGE) || "";
    const verifier = sessionStorage.getItem(AUTH_VERIFIER_STORAGE) || "";
    sessionStorage.removeItem(AUTH_STATE_STORAGE);
    sessionStorage.removeItem(AUTH_VERIFIER_STORAGE);
    if (!code || !state || !expectedState || state !== expectedState || !verifier) {
      throw new Error("登入狀態驗證失敗，請重新登入。");
    }
    const response = await fetch(AUTH_API_URL + "/token?client_id=" + encodeURIComponent(AUTH_CLIENT_ID), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ client_id: AUTH_CLIENT_ID, code, redirect_uri: AUTH_REDIRECT_URI, code_verifier: verifier }),
      cache: "no-store",
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.access_token) throw new Error(data.error || "Passkey 登入失敗。");
    authAccessToken = data.access_token;
    useLegacyKey = false;
    $("passkeyLogin").hidden = true;
    $("passkeyLogout").hidden = false;
    message("Chi Passkey 驗證成功。本分頁將使用短效授權，不會把存取權杖寫入 localStorage。", "ok");
  } catch (error) {
    message("Passkey 登入未完成：" + error.message, "error");
  } finally {
    history.replaceState(null, "", location.pathname);
  }
}
$("passkeyLogin").addEventListener("click", startPasskeyLogin);
$("passkeyLogout").addEventListener("click", () => {
  authAccessToken = "";
  useLegacyKey = false;
  $("passkeyLogout").hidden = true;
  $("passkeyLogin").hidden = false;
  message("已登出 Passkey。請重新登入，或明確選擇舊授權金鑰作為備援。", "ok");
});
$("legacyLogin").addEventListener("click", () => {
  useLegacyKey = true;
  const key = getKey();
  if (!key) { message("未輸入舊授權金鑰。", "warn"); return; }
  load();
});
$("reload").addEventListener("click", load);
$("search").addEventListener("input", render);
$("group").addEventListener("change", render);
$("forget").addEventListener("click", () => {
  try { localStorage.removeItem(KEY_STORAGE); } catch {}
  message("已清除此瀏覽器儲存的授權金鑰。", "ok");
});
initializePasskeySSO().finally(load);
</script>
